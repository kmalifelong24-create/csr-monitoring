<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>CSR 공고 모니터링</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f6fb; color: #1a1a2e; font-size: 14px; display: flex; flex-direction: column; }
  .header { background: #fff; border-bottom: 1px solid #e5e8f0; padding: 10px 24px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .header h1 { font-size: 16px; font-weight: 700; }
  .header .scan-info { font-size: 12px; color: #aaa; }
  .header .scan-info span { color: #3b82f6; font-weight: 600; }
  .nav-tabs { display: flex; gap: 4px; margin-left: auto; }
  .nav-tab { padding: 5px 14px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #e5e8f0; background: #f4f6fb; color: #666; text-decoration: none; display: flex; align-items: center; gap: 5px; transition: all 0.15s; }
  .nav-tab:hover { background: #eef2ff; border-color: #c7d2fe; color: #4338ca; }
  .nav-tab.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .stats { display: flex; gap: 10px; padding: 10px 24px 0; flex-shrink: 0; }
  .stat { background: #fff; border-radius: 10px; padding: 10px 16px; flex: 1; border: 1px solid #e5e8f0; }
  .stat .n { font-size: 22px; font-weight: 800; line-height: 1; }
  .stat .l { font-size: 11px; color: #888; margin-top: 2px; }
  .stat.red .n { color: #ef4444; }
  .stat.orange .n { color: #f59e0b; }
  .stat.purple .n { color: #8b5cf6; }
  .stat.blue .n { color: #3b82f6; }
  .stat.green .n { color: #22c55e; }
  .layout { display: grid; grid-template-columns: 2fr 1fr 0.5fr; gap: 12px; padding: 10px 24px 12px; flex: 1; min-height: 0; }

  /* ── 가운데 열: 캘린더 + 주요 이슈 ── */
  .layout > * { min-height: 0; }
  .mid-col { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden; }
  .mid-col > .cal-panel { flex: 0 0 auto; }
  .mid-col > .key-panel { flex: 1 1 0; min-height: 120px; overflow: hidden; }

  .cal-nav { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .cal-nav button { width: 22px; height: 22px; border: 1px solid #e5e8f0; background: #fff; border-radius: 6px; cursor: pointer; color: #666; font-size: 13px; line-height: 1; padding: 0; }
  .cal-nav button:hover { background: #eef2ff; border-color: #c7d2fe; color: #4338ca; }
  .cal-label { font-size: 12px; font-weight: 700; min-width: 78px; text-align: center; }
  .cal-today-btn { font-size: 10px !important; width: auto !important; padding: 0 6px !important; }

  .cal-wrap { padding: 8px 12px 10px; }
  .cal-dow { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; margin-bottom: 3px; }
  .cal-dow div { text-align: center; font-size: 10px; font-weight: 700; color: #94a3b8; padding: 2px 0; }
  .cal-dow div:first-child { color: #ef4444; }
  .cal-dow div:last-child { color: #3b82f6; }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
  .cal-cell { aspect-ratio: 1 / 0.86; border: 1px solid #f0f2f8; border-radius: 6px; padding: 3px 4px; font-size: 11px; color: #475569; cursor: default; display: flex; flex-direction: column; gap: 2px; overflow: hidden; background: #fff; }
  .cal-cell.other { background: #fafbfd; color: #cbd5e1; }
  .cal-cell.today { border-color: #3b82f6; box-shadow: inset 0 0 0 1px #3b82f6; }
  .cal-cell.has { cursor: pointer; background: #fff7ed; border-color: #fed7aa; }
  .cal-cell.has:hover { background: #ffedd5; }
  .cal-cell.has.urgent { background: #fef2f2; border-color: #fecaca; }
  .cal-cell.selected { outline: 2px solid #6366f1; outline-offset: -2px; }
  .cal-daynum { font-weight: 700; font-size: 11px; }
  .cal-chip { font-size: 9px; font-weight: 700; border-radius: 4px; padding: 1px 3px; background: #fed7aa; color: #9a3412; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-chip.urgent { background: #fecaca; color: #991b1b; }
  .cal-more { font-size: 9px; color: #94a3b8; }

  .cal-detail { border-top: 1px solid #f0f2f8; padding: 9px 12px; max-height: 150px; overflow-y: auto; flex-shrink: 0; }
  .cal-wrap { flex-shrink: 0; }
  .cal-detail-empty { font-size: 11px; color: #b0b8c8; text-align: center; padding: 10px 0; }
  .cal-detail-head { font-size: 11px; font-weight: 800; color: #4338ca; margin-bottom: 6px; }
  .cal-ev { border-left: 2px solid #c7d2fe; padding: 4px 0 4px 8px; margin-bottom: 6px; }
  .cal-ev:last-child { margin-bottom: 0; }
  .cal-ev-co { font-size: 11px; font-weight: 700; color: #3b82f6; }
  .cal-ev-label { font-size: 11px; font-weight: 700; color: #7c3aed; margin: 1px 0 2px; }
  .cal-ev-title { font-size: 11px; color: #475569; line-height: 1.45; }
  .cal-ev-meta { font-size: 10px; color: #94a3b8; margin-top: 2px; }
  .cal-ev-meta a { color: #3b82f6; text-decoration: none; }

  /* ── 주요 이슈 ── */
  .key-filter { display: flex; gap: 4px; padding: 7px 12px; border-bottom: 1px solid #f0f2f8; flex-shrink: 0; }
  .k-btn { padding: 3px 9px; border-radius: 6px; border: 1px solid #e5e8f0; background: #fff; font-size: 11px; cursor: pointer; color: #666; }
  .k-btn.active { background: #7c3aed; border-color: #7c3aed; color: #fff; font-weight: 600; }
  .key-list { flex: 1; overflow-y: auto; min-height: 0; }
  .key-item { padding: 9px 12px; border-bottom: 1px solid #f5f6fa; }
  .key-item:last-child { border-bottom: none; }
  .key-item:hover { background: #fbfaff; }
  .key-top { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; flex-wrap: wrap; }
  .key-reason { font-size: 9px; font-weight: 800; background: #ede9fe; color: #6d28d9; padding: 1px 5px; border-radius: 4px; }
  .key-dday { font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 4px; background: #fee2e2; color: #991b1b; }
  .key-dday.soon { background: #ffedd5; color: #9a3412; }
  .key-dday.later { background: #f1f5f9; color: #64748b; }
  .key-co { font-size: 11px; font-weight: 700; color: #3b82f6; }
  .key-title { font-size: 12px; font-weight: 600; color: #1a1a2e; line-height: 1.42; margin-bottom: 3px; }
  .key-note { font-size: 11px; color: #64748b; line-height: 1.5; background: #faf9ff; border-radius: 5px; padding: 5px 7px; }
  .key-meta { display: flex; gap: 8px; font-size: 10px; color: #aaa; margin-top: 4px; }
  .key-meta a { color: #3b82f6; text-decoration: none; }
  .key-empty { padding: 26px 16px; text-align: center; color: #bbb; font-size: 12px; line-height: 1.6; }
  .panel { background: #fff; border-radius: 10px; border: 1px solid #e5e8f0; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel-head { padding: 10px 16px; border-bottom: 1px solid #f0f2f8; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .panel-head h2 { font-size: 13px; font-weight: 700; }
  .panel-head .count { margin-left: auto; font-size: 11px; background: #f0f4ff; color: #3b82f6; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .tabs { display: flex; padding: 0 16px; border-bottom: 1px solid #f0f2f8; flex-shrink: 0; overflow-x: auto; }
  .tab { padding: 8px 12px; font-size: 12px; color: #888; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; white-space: nowrap; }
  .tab.active { color: #3b82f6; border-bottom-color: #3b82f6; font-weight: 700; }
  .news-list { flex: 1; overflow-y: auto; min-height: 0; }
  .news-item { padding: 12px 16px; border-bottom: 1px solid #f5f6fa; }
  .news-item:last-child { border-bottom: none; }
  .news-item:hover { background: #fafbff; }
  .news-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 5px; }
  .badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: 6px; font-size: 10px; font-weight: 700; white-space: nowrap; }
  .badge-recruit { background: #fef3c7; color: #b45309; }
  .badge-news { background: #e0f2fe; color: #0369a1; }
  .badge-tender { background: #fce7f3; color: #9d174d; }
  .badge-open { background: #dcfce7; color: #166534; }
  .badge-closed { background: #fee2e2; color: #991b1b; }
  .news-company { font-size: 11px; font-weight: 700; color: #3b82f6; margin-bottom: 2px; }
  .news-title { font-size: 13px; font-weight: 600; color: #1a1a2e; margin-bottom: 4px; line-height: 1.4; }
  .news-summary { font-size: 12px; color: #4b5563; line-height: 1.6; margin-bottom: 6px; }
  .track-box { background: #faf7ff; border: 1px solid #e9d5ff; border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; }
  .track-label { font-size: 10px; font-weight: 800; color: #7c3aed; letter-spacing: 0.5px; margin-bottom: 3px; }
  .track-text { font-size: 12px; color: #374151; line-height: 1.5; }
  .track-when { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700; color: #7c3aed; background: #ede9fe; padding: 2px 8px; border-radius: 4px; }
  .news-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .news-date { font-size: 11px; color: #aaa; }
  .news-link { font-size: 11px; color: #3b82f6; text-decoration: none; }
  .news-link:hover { text-decoration: underline; }
  .deadline-open { font-size: 11px; background: #dcfce7; color: #166534; padding: 2px 7px; border-radius: 4px; font-weight: 700; }
  .deadline-closed { font-size: 11px; background: #f1f5f9; color: #94a3b8; padding: 2px 7px; border-radius: 4px; font-weight: 600; text-decoration: line-through; }
  .new-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #ef4444; margin-right: 5px; vertical-align: middle; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
  .archive-week { border-bottom: 1px solid #f0f2f8; }
  .archive-week:last-child { border-bottom: none; }
  .archive-week-header { padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; background: #f8f9ff; font-size: 12px; font-weight: 700; color: #374151; user-select: none; }
  .archive-week-header:hover { background: #eef2ff; }
  .week-count { font-size: 11px; background: #e0e7ff; color: #4338ca; padding: 1px 7px; border-radius: 10px; font-weight: 700; }
  .toggle-icon { margin-left: auto; font-size: 11px; color: #aaa; }
  .empty-state { padding: 40px 24px; text-align: center; color: #bbb; }
  .empty-state .icon { font-size: 28px; margin-bottom: 8px; }
  .empty-state p { font-size: 13px; line-height: 1.6; }
  .search-wrap { padding: 8px 14px; border-bottom: 1px solid #f0f2f8; flex-shrink: 0; }
  .search-input { width: 100%; padding: 6px 10px; border: 1px solid #e5e8f0; border-radius: 7px; font-size: 12px; outline: none; }
  .search-input:focus { border-color: #3b82f6; }
  .filter-row { display: flex; gap: 5px; padding: 8px 14px; border-bottom: 1px solid #f0f2f8; flex-wrap: wrap; flex-shrink: 0; }
  .f-btn { padding: 3px 9px; border-radius: 6px; border: 1px solid #e5e8f0; background: #fff; font-size: 11px; cursor: pointer; color: #666; }
  .f-btn.active { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: 600; }
  .company-list { flex: 1; overflow-y: auto; min-height: 0; }
  .company-row { padding: 8px 14px; border-bottom: 1px solid #f5f6fa; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .company-row:last-child { border-bottom: none; }
  .company-row:hover { background: #fafbff; }
  .company-row.has-news { background: #fffbf0; }
  .company-name-text { font-size: 12px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .company-news-count { font-size: 10px; background: #ef4444; color: #fff; padding: 1px 6px; border-radius: 10px; font-weight: 700; flex-shrink: 0; }
  .priority-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .p-high { background: #f59e0b; }
  .p-cond { background: #3b82f6; }
  .p-low { background: #d1d5db; }
</style>
</head>
<body>
<div class="header">
  <span style="font-size:18px">📡</span>
  <h1>KMA 임팩트 비즈니스</h1>
  <div class="scan-info" style="margin-left:12px">마지막 수집: <span id="lastScan">—</span></div>
  <div class="nav-tabs">
    <a class="nav-tab active" href="index.html">📡 CSR 모니터링</a>
    <a class="nav-tab" href="proposal.html">✨ 맞춤 제안 전략</a>
  </div>
</div>
<div class="stats">
  <div class="stat red"><div class="n" id="sOpen">0</div><div class="l">모집 진행 중</div></div>
  <div class="stat orange"><div class="n" id="sRecruit">0</div><div class="l">모집·공모 발견</div></div>
  <div class="stat purple"><div class="n" id="sTrack">0</div><div class="l">추적 예정</div></div>
  <div class="stat blue"><div class="n" id="sNews">0</div><div class="l">뉴스·소식</div></div>
  <div class="stat green"><div class="n" id="sTotal">0</div><div class="l">모니터링 기업</div></div>
</div>
<div class="layout">
  <div class="panel">
    <div class="panel-head">
      <span>📋</span><h2>수집된 공고 및 뉴스</h2>
      <div class="count" id="feedCount">0건</div>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="setTab('all',this)">전체</div>
      <div class="tab" onclick="setTab('open',this)">🟢 모집 중</div>
      <div class="tab" onclick="setTab('recruit',this)">📢 모집·공모</div>
      <div class="tab" onclick="setTab('track',this)">🔮 추적 예정</div>
      <div class="tab" onclick="setTab('news',this)">📰 뉴스</div>
      <div class="tab" onclick="setTab('archive',this)">📦 아카이브</div>
    </div>
    <div class="news-list" id="newsFeed"></div>
  </div>
  <!-- 가운데: 캘린더 + 주요 이슈 -->
  <div class="mid-col">
    <div class="panel cal-panel">
      <div class="panel-head">
        <span>📅</span><h2>제안 타이밍</h2>
        <div class="cal-nav">
          <button onclick="calMove(-1)" title="이전 달">‹</button>
          <span class="cal-label" id="calLabel">—</span>
          <button onclick="calMove(1)" title="다음 달">›</button>
          <button class="cal-today-btn" onclick="calToday()" title="이번 달로">오늘</button>
        </div>
      </div>
      <div class="cal-wrap">
        <div class="cal-dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div class="cal-detail" id="calDetail"></div>
    </div>

    <div class="panel key-panel">
      <div class="panel-head">
        <span>⭐</span><h2>주요 이슈</h2>
        <div class="count" id="keyCount">0건</div>
      </div>
      <div class="key-filter">
        <button class="k-btn active" onclick="setKeyRange(7,this)">최근 7일</button>
        <button class="k-btn" onclick="setKeyRange(30,this)">30일</button>
        <button class="k-btn" onclick="setKeyRange(0,this)">전체</button>
      </div>
      <div class="key-list" id="keyList"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><span>🏢</span><h2>모니터링 기업</h2></div>
    <div class="search-wrap">
      <input class="search-input" id="companySearch" placeholder="기업명 검색..." oninput="renderCompanies()">
    </div>
    <div class="filter-row">
      <button class="f-btn active" onclick="setCompanyFilter('all',this)">전체</button>
      <button class="f-btn" onclick="setCompanyFilter('high',this)">⭐ 우선</button>
      <button class="f-btn" onclick="setCompanyFilter('cond',this)">🔵 조건부</button>
      <button class="f-btn" onclick="setCompanyFilter('news',this)">🔴 공고있음</button>
    </div>
    <div class="company-list" id="companyList"></div>
  </div>
</div>

let currentTab = 'all', companyFilter = 'all';
function setTab(t, el) {
  currentTab = t;
  document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  renderFeed();
}
function setCompanyFilter(f, el) {
  companyFilter = f;
  document.querySelectorAll('.f-btn').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  renderCompanies();
}
function statusBadge(item) {
  if (item.status === 'open') return '<span class="badge badge-open">🟢 모집 중</span>';
  if (item.status === 'closed') return '<span class="badge badge-closed">🔴 마감</span>';
  return '';
}
function typeBadge(type) {
  if (type === 'recruit') return '<span class="badge badge-recruit">📢 모집·공모</span>';
  if (type === 'tender') return '<span class="badge badge-tender">📑 입찰</span>';
  return '<span class="badge badge-news">📰 뉴스</span>';
}
function renderItem(f) {
  return `<div class="news-item">
    <div class="news-badges">${typeBadge(f.type)}${statusBadge(f)}</div>
    <div class="news-company">${f.isNew ? '<span class="new-dot"></span>' : ''}${f.company}</div>
    <div class="news-title">${f.title}</div>
    <div class="news-summary">${f.summary}</div>
    ${f.trackNote ? `<div class="track-box">
      <div class="track-label">🔮 추적 가이드</div>
      <div class="track-text">${f.trackNote}</div>
      ${f.trackWhen ? `<div class="track-when">⏰ ${f.trackWhen}</div>` : ''}
    </div>` : ''}
    <div class="news-meta">
      <span class="news-date">수집: ${f.date}</span>
      ${f.deadline ? (f.status === 'open'
        ? `<span class="deadline-open">마감 ${f.deadline}</span>`
        : `<span class="deadline-closed">마감 ${f.deadline}</span>`) : ''}
      ${f.url ? `<a class="news-link" href="${f.url}" target="_blank">🔗 원문</a>` : ''}
    </div>
  </div>`;
}
function renderFeed() {
  const feed = document.getElementById('newsFeed');
  if (currentTab === 'archive') {
    if (!ARCHIVE.length) {
      feed.innerHTML = '<div class="empty-state"><div class="icon">📦</div><p>아직 아카이브된 기록이 없습니다.<br>7일이 지난 뉴스가 자동으로 여기 쌓입니다.</p></div>';
      document.getElementById('feedCount').textContent = '0건';
      return;
    }
    const total = ARCHIVE.reduce((s, w) => s + w.items.length, 0);
    document.getElementById('feedCount').textContent = total + '건';
    feed.innerHTML = ARCHIVE.map(week => `
      <div class="archive-week">
        <div class="archive-week-header" onclick="toggleWeek(this)">
          📅 ${week.week}
          <span class="week-count">${week.items.length}건</span>
          <span class="toggle-icon">▶</span>
        </div>
        <div class="archive-week-body" style="display:none">
          ${week.items.map(f => renderItem(f)).join('')}
        </div>
      </div>`).join('');
    return;
  }
  let data = [...FINDINGS];
  if (currentTab === 'open')    data = data.filter(f => f.status === 'open');
  if (currentTab === 'recruit') data = data.filter(f => f.type === 'recruit');
  if (currentTab === 'track')   data = data.filter(f => f.trackNote);
  if (currentTab === 'news')    data = data.filter(f => f.type === 'news');
  data.sort((a, b) => ({open:0,closed:1,news:2}[a.status]||2) - ({open:0,closed:1,news:2}[b.status]||2));
  document.getElementById('feedCount').textContent = data.length + '건';
  if (!data.length) {
    feed.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>수집된 공고가 없습니다.<br>매일 오전 9시 자동 스캔됩니다.</p></div>';
    return;
  }
  feed.innerHTML = data.map(f => renderItem(f)).join('');
}
function toggleWeek(header) {
  const body = header.nextElementSibling;
  const icon = header.querySelector('.toggle-icon');
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : 'block';
  icon.textContent = isOpen ? '▶' : '▼';
}
function renderCompanies() {
  const q = document.getElementById('companySearch').value.trim();
  const withNews = new Set(FINDINGS.map(f => f.company));
  let list = [...COMPANIES];
  if (q) list = list.filter(c => c.name.includes(q));
  if (companyFilter === 'high') list = list.filter(c => c.priority === 'high');
  if (companyFilter === 'cond') list = list.filter(c => c.priority === 'cond');
  if (companyFilter === 'news') list = list.filter(c => withNews.has(c.name));
  list.sort((a, b) => (withNews.has(a.name) ? 0 : 1) - (withNews.has(b.name) ? 0 : 1));
  document.getElementById('companyList').innerHTML = list.map(c => {
    const cnt = FINDINGS.filter(f => f.company === c.name).length;
    const dot = c.priority === 'high' ? 'p-high' : c.priority === 'cond' ? 'p-cond' : 'p-low';
    return `<div class="company-row ${cnt ? 'has-news' : ''}" onclick="filterByCompany('${c.name.replace(/'/g,"\\'")}')">
      <div class="priority-dot ${dot}"></div>
      <div class="company-name-text" title="${c.name}">${c.name}</div>
      ${cnt ? `<div class="company-news-count">${cnt}</div>` : ''}
    </div>`;
  }).join('');
}
function filterByCompany(name) {
  const data = FINDINGS.filter(f => f.company === name);
  if (!data.length) return;
  document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
  document.getElementById('feedCount').textContent = data.length + '건';
  document.getElementById('newsFeed').innerHTML = data.map(f => renderItem(f)).join('');
}
function updateStats() {
  document.getElementById('sOpen').textContent = FINDINGS.filter(f => f.status === 'open').length;
  document.getElementById('sRecruit').textContent = FINDINGS.filter(f => f.type === 'recruit').length;
  document.getElementById('sTrack').textContent = FINDINGS.filter(f => f.trackNote).length;
  document.getElementById('sNews').textContent = FINDINGS.filter(f => f.type === 'news').length;
  document.getElementById('sTotal').textContent = COMPANIES.length;
  const dates = FINDINGS.map(f => f.date).filter(Boolean).sort();
  document.getElementById('lastScan').textContent = dates.length ? dates[dates.length - 1] : '아직 없음';
}

// ═══════════════════════════════════════════════════════════════
// 제안 타이밍 캘린더 + 주요 이슈
// (스크립트가 계산한 값이 있으면 그걸 쓰고, 없으면 여기서 직접 계산)
// ═══════════════════════════════════════════════════════════════

function addMonths(d, n) {
  const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
  const last = new Date(y, m + n + 1, 0).getDate();
  return new Date(y, m + n, Math.min(day, last));
}
function ymd(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function parseYmd(s) {
  if (!s) return null;
  const p = String(s).split('-').map(Number);
  if (p.length !== 3 || p.some(isNaN)) return null;
  return new Date(p[0], p[1]-1, p[2]);
}

// 게시일 기준으로 상태를 다시 판정한다.
// 수집 당시 '모집 중'이던 옛 공고가 계속 진행 중으로 남는 것을 막는다.
function effStatus(f) {
  const text = (f.title || '') + ' ' + (f.summary || '');
  if (['종료','마감됨','선정 완료','완료'].some(w => text.includes(w))) return 'closed';
  const d = parseYmd(f.date);
  if (!d) return f.status || 'closed';
  const t = new Date(); t.setHours(0,0,0,0);
  const age = Math.round((t - d) / 86400000);
  return age <= 14 ? 'open' : 'closed';
}

// 파이썬 로직과 동일한 규칙 (스크립트 실행 전에도 작동하도록)
function computeTiming(f) {
  if (f.actionDate) return { action: f.actionDate, next: f.nextCycle || null, label: f.timingLabel || '추적 대상' };
  const d = parseYmd(f.date);
  if (!d) return { action: null, next: null, label: '' };
  const st = effStatus(f);
  const text = (f.title || '') + ' ' + (f.summary || '');
  const annual = ['연간','년도','2026','2027','차년도'].some(w => text.includes(w));
  const partnership = ['협약','파트너십','위탁','MOU','업무협약'].some(w => text.includes(w));
  if (st === 'open' && (f.type === 'recruit' || f.type === 'tender'))
    return { action: ymd(d), next: null, label: '즉시 검토 — 모집 진행 중' };
  if (f.type === 'recruit' && annual)
    return { action: ymd(addMonths(d,8)), next: ymd(addMonths(d,11)), label: '제안서 선제 발송' };
  if (f.type === 'recruit')
    return { action: ymd(addMonths(d,6)), next: ymd(addMonths(d,9)), label: '다음 공모 대비 준비' };
  if (f.type === 'tender')
    return { action: ymd(addMonths(d,9)), next: ymd(addMonths(d,12)), label: '차기 입찰 준비' };
  if (partnership)
    return { action: ymd(addMonths(d,9)), next: ymd(addMonths(d,12)), label: '재계약 전 대안 제안' };
  return { action: ymd(addMonths(d,4)), next: null, label: '사업 기획 시점 컨텍' };
}

const STRONG = [
  [['운영기관','수행기관','위탁운영','위탁 운영','협력기관','참여기관'], 45, '운영·수행기관 모집'],
  [['입찰','나라장터','용역 공고','낙찰'], 45, '입찰 공고'],
  [['공모','공개모집','공개 모집'], 30, '공모 진행'],
  [['위탁','민간위탁'], 30, '위탁 사업'],
  [['협약','업무협약','MOU','파트너십'], 27, '협약 체결 — 재계약 시점 추적'],
  [['선정','선정돼','선정됐'], 27, '수행기관 선정 — 계약 주기 파악'],
  [['사업 개편','신규 사업','사업 확대','확대 운영','신설'], 25, '사업 방향 변화'],
];
const WEAK = [
  [['기탁','전달식','성료','수여식','개최','발대식'], -18],
  [['봉사','캠페인','체험행사'], -12],
];
const KEY_THRESHOLD = 45;

function scoreItem(f) {
  if (typeof f.keyScore === 'number') return { score: f.keyScore, reason: f.keyReason || '', isKey: !!f.isKey };
  const text = (f.title || '') + ' ' + (f.summary || '');
  let score = f.type === 'tender' ? 25 : f.type === 'recruit' ? 20 : 3;
  if (effStatus(f) === 'open') score += 15;
  let reason = '';
  for (const [ws, pts, label] of STRONG) {
    if (ws.some(w => text.includes(w))) { score += pts; reason = label; break; }
  }
  for (const [ws, pts] of WEAK) {
    if (ws.some(w => text.includes(w))) { score += pts; break; }
  }
  if (!reason) reason = f.type !== 'news' ? '모집·공고 관련' : '동향 참고';
  score = Math.max(score, 0);
  return { score, reason, isKey: score >= KEY_THRESHOLD };
}

// 피드 + 아카이브 전체를 하나로 (캘린더·주요이슈 재료)
function allItems() {
  const arch = [];
  (typeof ARCHIVE !== 'undefined' ? ARCHIVE : []).forEach(w => (w.items || []).forEach(i => arch.push(i)));
  const seen = new Set();
  return [...FINDINGS, ...arch].filter(f => {
    const k = f.id || (f.company + f.title);
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
}

function daysUntil(dateStr) {
  const d = parseYmd(dateStr); if (!d) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}

// 같은 기사가 여러 기업에 중복 매칭되는 경우 하나로 합친다.
// 캘린더·주요이슈에는 '주요 이슈'로 판정된 것만 올린다 (일반 뉴스는 타이밍 의미가 낮아 제외).
function mergedKeyItems() {
  const map = new Map();
  allItems().forEach(f => {
    const s = scoreItem(f);
    if (!s.isKey) return;
    const t = computeTiming(f);
    const k = (f.title || '') + '|' + (t.action || '');
    if (map.has(k)) {
      const e = map.get(k);
      if (f.company && !e.companies.includes(f.company)) e.companies.push(f.company);
      if (s.score > e._s.score) e._s = s;
    } else {
      map.set(k, { ...f, companies: f.company ? [f.company] : [], _s: s, _t: t });
    }
  });
  return [...map.values()];
}

function coLabel(x) {
  const n = x.companies.length;
  if (!n) return x.company || '—';
  return n > 1 ? `${x.companies[0]} 외 ${n - 1}곳` : x.companies[0];
}

// 현재 모집이 진행 중인 건은 '지남'이 아니라 '지금 해야 할 일'이다.
// 게시일이 오래됐으면(마감 추정) 진행 중으로 보지 않는다.
function isLive(x) {
  return effStatus(x) === 'open' && (x._t.label || '').includes('즉시');
}
// 정렬·D-day 계산용 (진행 중이면 0으로 최우선)
function urgencyDays(x) {
  if (isLive(x)) return 0;
  const d = daysUntil(x._t.action);
  return (d === null || d < 0) ? 9999 : d;
}
// 캘린더에 찍을 날짜 (진행 중이면 오늘로 끌어올림)
function calDate(x) {
  return isLive(x) ? ymd(new Date()) : x._t.action;
}

// ── 캘린더 ──────────────────────────────────────────────────
let calCursor = new Date();
let calSelected = null;

function buildEventMap() {
  const map = {};
  mergedKeyItems().forEach(x => {
    const k = calDate(x);
    if (!k) return;
    (map[k] = map[k] || []).push(x);
  });
  return map;
}

function renderCalendar() {
  const grid = document.getElementById('calGrid');
  if (!grid) return;
  const map = buildEventMap();
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  document.getElementById('calLabel').textContent = `${y}년 ${m+1}월`;

  const first = new Date(y, m, 1);
  const start = new Date(y, m, 1 - first.getDay());
  const todayStr = ymd(new Date());

  let html = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const key = ymd(d);
    const evs = map[key] || [];
    const other = d.getMonth() !== m;
    const dd = daysUntil(key);
    const urgent = evs.length && dd !== null && dd >= 0 && dd <= 7;
    const cls = ['cal-cell'];
    if (other) cls.push('other');
    if (key === todayStr) cls.push('today');
    if (evs.length) cls.push('has');
    if (urgent) cls.push('urgent');
    if (key === calSelected) cls.push('selected');

    let inner = `<div class="cal-daynum">${d.getDate()}</div>`;
    if (evs.length) {
      const nm = coLabel(evs[0]);
      inner += `<div class="cal-chip ${urgent ? 'urgent' : ''}" title="${nm}">${nm}</div>`;
      if (evs.length > 1) inner += `<div class="cal-more">+${evs.length - 1}건</div>`;
    }
    html += `<div class="${cls.join(' ')}" ${evs.length ? `onclick="calSelect('${key}')"` : ''}>${inner}</div>`;
  }
  grid.innerHTML = html;
  renderCalDetail(map);
}

function renderCalDetail(map) {
  const box = document.getElementById('calDetail');
  if (!box) return;
  map = map || buildEventMap();

  if (!calSelected || !map[calSelected]) {
    // 선택 없으면 다가오는 일정 요약
    const upcoming = Object.keys(map)
      .map(k => ({ k, d: daysUntil(k) }))
      .filter(x => x.d !== null && x.d >= 0)
      .sort((a,b) => a.d - b.d).slice(0, 3);
    if (!upcoming.length) {
      box.innerHTML = '<div class="cal-detail-empty">표시할 일정이 없습니다.<br>날짜를 누르면 상세가 나옵니다.</div>';
      return;
    }
    box.innerHTML = '<div class="cal-detail-head">⏰ 다가오는 일정</div>' +
      upcoming.map(u => {
        const x = map[u.k][0];
        const extra = map[u.k].length > 1 ? ` 외 ${map[u.k].length-1}건` : '';
        return `<div class="cal-ev">
          <div class="cal-ev-co">${coLabel(x)}${extra}</div>
          <div class="cal-ev-label">${x._t.label}</div>
          <div class="cal-ev-meta">${u.k} · ${u.d === 0 ? '오늘' : 'D-' + u.d}</div>
        </div>`;
      }).join('');
    return;
  }

  const evs = map[calSelected];
  box.innerHTML = `<div class="cal-detail-head">📌 ${calSelected} · ${evs.length}건</div>` +
    evs.map(x => `<div class="cal-ev">
      <div class="cal-ev-co">${coLabel(x)}</div>
      <div class="cal-ev-label">${x._t.label}</div>
      <div class="cal-ev-title">${x.title}</div>
      <div class="cal-ev-meta">
        근거 뉴스 ${x.date}${x._t.next ? ` · 다음 주기 예상 ${x._t.next}` : ''}
        ${x.url ? ` · <a href="${x.url}" target="_blank">원문</a>` : ''}
      </div>
    </div>`).join('');
}

function calMove(n) { calCursor = addMonths(calCursor, n); calSelected = null; renderCalendar(); }
function calToday() { calCursor = new Date(); calSelected = null; renderCalendar(); }
function calSelect(key) { calSelected = (calSelected === key ? null : key); renderCalendar(); }

// ── 주요 이슈 ────────────────────────────────────────────────
let keyRange = 7;
function setKeyRange(n, el) {
  keyRange = n;
  document.querySelectorAll('.k-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderKeyIssues();
}

function renderKeyIssues() {
  const box = document.getElementById('keyList');
  if (!box) return;
  const today = new Date(); today.setHours(0,0,0,0);

  let list = mergedKeyItems();

  if (keyRange > 0) {
    list = list.filter(x => {
      const d = parseYmd(x.date);
      return d && (today - d) / 86400000 <= keyRange;
    });
  }

  // 진행 중 → 임박한 실행일 → 점수순
  list.sort((a, b) => {
    const va = urgencyDays(a), vb = urgencyDays(b);
    if (va !== vb) return va - vb;
    return b._s.score - a._s.score;
  });

  document.getElementById('keyCount').textContent = list.length + '건';

  if (!list.length) {
    box.innerHTML = `<div class="key-empty">해당 기간에 주요 이슈가 없습니다.<br>기간을 넓혀보세요.</div>`;
    return;
  }

  box.innerHTML = list.map(x => {
    let ddHtml = '';
    if (isLive(x)) {
      ddHtml = `<span class="key-dday">🔥 진행 중</span>`;
    } else {
      const dd = daysUntil(x._t.action);
      if (dd !== null) {
        if (dd < 0) ddHtml = `<span class="key-dday later">지남</span>`;
        else if (dd === 0) ddHtml = `<span class="key-dday">오늘</span>`;
        else if (dd <= 7) ddHtml = `<span class="key-dday">D-${dd}</span>`;
        else if (dd <= 30) ddHtml = `<span class="key-dday soon">D-${dd}</span>`;
        else ddHtml = `<span class="key-dday later">D-${dd}</span>`;
      }
    }
    const coTitle = x.companies.join(', ');
    return `<div class="key-item">
      <div class="key-top">
        <span class="key-reason">${x._s.reason}</span>
        ${ddHtml}
        <span class="key-co" title="${coTitle}">${coLabel(x)}</span>
      </div>
      <div class="key-title">${x.title}</div>
      <div class="key-note">${x._t.label}${x._t.action ? ` · ${x._t.action}` : ''}${x._t.next ? ` (다음 주기 ${x._t.next})` : ''}</div>
      <div class="key-meta">
        <span>수집 ${x.date}</span>
        ${x.url ? `<a href="${x.url}" target="_blank">🔗 원문</a>` : ''}
      </div>
    </div>`;
  }).join('');
}

updateStats(); renderFeed(); renderCompanies(); renderCalendar(); renderKeyIssues();
</script>
