<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>맞춤 제안 생성 · KMA CSR</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f6fb; color: #1a1a2e; font-size: 14px; display: flex; flex-direction: column; }

  /* Header */
  .header { background: #fff; border-bottom: 1px solid #e5e8f0; padding: 10px 24px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .header h1 { font-size: 16px; font-weight: 700; }
  .nav-tabs { display: flex; gap: 4px; margin-left: 12px; }
  .nav-tab { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; text-decoration: none; color: #666; transition: all 0.15s; }
  .nav-tab:hover { background: #f0f4ff; color: #3b82f6; }
  .nav-tab.active { background: #3b82f6; color: #fff; }

  /* Layout */
  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 12px; padding: 12px 24px; flex: 1; min-height: 0; }

  /* Panels */
  .panel { background: #fff; border-radius: 10px; border: 1px solid #e5e8f0; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel-head { padding: 10px 16px; border-bottom: 1px solid #f0f2f8; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .panel-head h2 { font-size: 13px; font-weight: 700; }
  .panel-count { margin-left: auto; font-size: 11px; background: #f0f4ff; color: #3b82f6; padding: 2px 8px; border-radius: 10px; font-weight: 600; }

  /* Company list */
  .search-wrap { padding: 8px 12px; border-bottom: 1px solid #f0f2f8; flex-shrink: 0; }
  .search-input { width: 100%; padding: 6px 10px; border: 1px solid #e5e8f0; border-radius: 7px; font-size: 12px; outline: none; }
  .search-input:focus { border-color: #3b82f6; }
  .filter-row { display: flex; gap: 4px; padding: 6px 12px; border-bottom: 1px solid #f0f2f8; flex-wrap: wrap; flex-shrink: 0; }
  .f-btn { padding: 3px 8px; border-radius: 6px; border: 1px solid #e5e8f0; background: #fff; font-size: 11px; cursor: pointer; color: #666; }
  .f-btn.active { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: 600; }
  .company-list { flex: 1; overflow-y: auto; min-height: 0; }
  .company-row { padding: 8px 12px; border-bottom: 1px solid #f5f6fa; display: flex; align-items: center; gap: 7px; cursor: pointer; transition: background 0.1s; }
  .company-row:hover { background: #f5f7ff; }
  .company-row.selected { background: #eff6ff; border-right: 3px solid #3b82f6; }
  .priority-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .p-A { background: #22c55e; }
  .p-none { background: #d1d5db; }
  .p-B { background: #3b82f6; }
  .p-C { background: #94a3b8; }
  .company-name-text { font-size: 12px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sector-badge { font-size: 10px; background: #f0f4ff; color: #4f46e5; padding: 1px 5px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }

  /* Right panel */
  .proposal-area { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }

  /* Company card */
  .company-card { background: #f8faff; border: 1px solid #dbeafe; border-radius: 10px; padding: 14px; }
  .company-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .company-card-name { font-size: 17px; font-weight: 800; }
  .priority-chip { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; }
  .chip-A { background: #dcfce7; color: #166534; }
  .chip-B { background: #dbeafe; color: #1e40af; }
  .chip-C { background: #f1f5f9; color: #475569; }
  .chip-high { background: #fef3c7; color: #b45309; }
  .company-card-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; margin-bottom: 10px; }
  .meta-item { display: flex; flex-direction: column; gap: 2px; }
  .meta-label { font-size: 10px; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .meta-value { color: #1a1a2e; font-weight: 500; }
  .programs-label { font-size: 10px; color: #94a3b8; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 5px; }
  .program-tag { display: inline-block; background: #fff; border: 1px solid #e5e8f0; border-radius: 5px; padding: 2px 7px; font-size: 11px; margin: 2px 2px 2px 0; }
  .kma-points { margin-top: 10px; background: #faf5ff; border: 1px solid #e9d5ff; border-radius: 7px; padding: 9px 11px; }
  .kma-points-label { font-size: 10px; color: #7c3aed; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 5px; }
  .kma-point { font-size: 12px; color: #374151; padding: 2px 0; display: flex; gap: 5px; line-height: 1.5; }
  .kma-point::before { content: '→'; color: #7c3aed; flex-shrink: 0; }
  .notes-box { margin-top: 8px; font-size: 11px; color: #6b7280; background: #fff; border: 1px solid #e5e8f0; border-radius: 6px; padding: 6px 9px; }

  /* News section */
  .news-section { background: #fffbf0; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 12px; }
  .news-section-label { font-size: 10px; color: #b45309; font-weight: 800; margin-bottom: 6px; letter-spacing: 0.5px; }
  .news-item-mini { padding: 5px 0; border-bottom: 1px solid #fef3c7; }
  .news-item-mini:last-child { border-bottom: none; }
  .news-title-mini { font-size: 12px; font-weight: 600; color: #1a1a2e; margin-bottom: 2px; line-height: 1.4; }
  .news-meta-mini { display: flex; gap: 8px; font-size: 10px; color: #b45309; }
  .news-badge-mini { display: inline-flex; padding: 1px 5px; border-radius: 4px; font-weight: 700; }
  .badge-recruit { background: #fef3c7; color: #b45309; }
  .badge-news { background: #e0f2fe; color: #0369a1; }
  .no-news { font-size: 12px; color: #aaa; padding: 4px 0; }

  /* API settings */
  .api-section { background: #fff; border: 1px solid #e5e8f0; border-radius: 8px; padding: 12px; }
  .api-section-label { font-size: 11px; font-weight: 700; color: #374151; margin-bottom: 8px; }
  .api-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .api-row:last-child { margin-bottom: 0; }
  .api-label { font-size: 11px; color: #666; width: 58px; flex-shrink: 0; }
  .api-input { flex: 1; padding: 6px 10px; border: 1px solid #e5e8f0; border-radius: 7px; font-size: 12px; outline: none; font-family: monospace; }
  .api-input:focus { border-color: #3b82f6; }
  .api-select { flex: 1; padding: 6px 10px; border: 1px solid #e5e8f0; border-radius: 7px; font-size: 12px; outline: none; background: #fff; }
  .save-btn { padding: 5px 10px; background: #f0f4ff; border: 1px solid #bfdbfe; border-radius: 7px; font-size: 11px; color: #3b82f6; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .save-btn:hover { background: #dbeafe; }

  /* Generate button */
  .generate-btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity 0.15s; letter-spacing: 0.3px; }
  .generate-btn:hover:not(:disabled) { opacity: 0.9; }
  .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Results */
  .result-section { background: #fff; border: 1px solid #e5e8f0; border-radius: 10px; overflow: hidden; }
  .result-tabs { display: flex; border-bottom: 1px solid #e5e8f0; }
  .result-tab { flex: 1; padding: 10px; text-align: center; font-size: 12px; font-weight: 600; cursor: pointer; color: #888; border-bottom: 2px solid transparent; transition: all 0.15s; }
  .result-tab.active { color: #3b82f6; border-bottom-color: #3b82f6; background: #f8faff; }
  .result-content { padding: 14px; }
  .result-text { font-size: 13px; line-height: 1.75; color: #1a1a2e; white-space: pre-wrap; word-break: keep-all; }
  .copy-row { display: flex; gap: 6px; margin-top: 10px; }
  .copy-btn { display: flex; align-items: center; gap: 4px; padding: 5px 10px; background: #f0f4ff; border: 1px solid #bfdbfe; border-radius: 6px; font-size: 11px; color: #3b82f6; cursor: pointer; font-weight: 600; }
  .copy-btn:hover { background: #dbeafe; }

  /* Loading */
  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 36px; color: #888; }
  .spinner { width: 24px; height: 24px; border: 2.5px solid #e5e8f0; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; }

  /* Empty state */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; color: #bbb; gap: 10px; flex: 1; }
  .empty-icon { font-size: 36px; }
  .empty-text { font-size: 13px; line-height: 1.7; }

  /* Alerts */
  .alert { padding: 7px 11px; border-radius: 7px; font-size: 12px; margin-top: 6px; }
  .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  .alert-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }

  /* Card sections */
  .card-section { margin-top: 11px; padding-top: 10px; border-top: 1px solid #e8eef8; }
  .card-section-label { font-size: 10px; color: #94a3b8; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }

  /* Source badge */
  .source-badges { display: flex; gap: 5px; flex-wrap: wrap; }
  .source-badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
  .source-csr { background: #f0fdf4; color: #15803d; border: 1px solid #86efac; }
  .source-cck { background: #eff6ff; color: #1d4ed8; border: 1px solid #93c5fd; }

  /* Recommendation badge */
  .chip-rec-Y { background: #dcfce7; color: #166534; }
  .chip-rec-cond { background: #fef9c3; color: #854d0e; }
  .chip-rec-N { background: #fee2e2; color: #991b1b; }

  /* Core values box */
  .core-values-box { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 7px; padding: 8px 11px; font-size: 12px; color: #0c4a6e; line-height: 1.6; }

  /* Keyword & field chips */
  .chips-wrap { display: flex; flex-wrap: wrap; gap: 4px; }
  .kw-chip { display: inline-block; background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 10px; padding: 2px 8px; font-size: 11px; color: #6d28d9; }
  .kma-field-chip { display: inline-block; background: #faf5ff; border: 1px solid #e9d5ff; border-radius: 10px; padding: 2px 8px; font-size: 11px; color: #7c3aed; font-weight: 600; }

  /* Contact box */
  .contact-box { background: #f8faff; border: 1px solid #dbeafe; border-radius: 7px; padding: 8px 11px; }
  .contact-line { font-size: 12px; color: #1e40af; word-break: break-all; line-height: 1.6; }
  .contact-status-line { font-size: 11px; color: #6b7280; margin-top: 4px; }
  .status-yet { color: #9ca3af; }
  .status-ongoing { color: #d97706; font-weight: 600; }
  .status-done { color: #16a34a; font-weight: 600; }

  /* Donation highlight */
  .donation-highlight { font-size: 15px; font-weight: 800; color: #1d4ed8; }

  /* Program list */
  .program-list { list-style: none; padding: 0; margin: 0; }
  .program-list li { font-size: 12px; color: #374151; padding: 3px 0 3px 14px; position: relative; line-height: 1.5; border-bottom: 1px dashed #f0f2f8; }
  .program-list li:last-child { border-bottom: none; }
  .program-list li::before { content: '·'; position: absolute; left: 4px; color: #94a3b8; font-weight: 700; }

  /* Collab box */
  .collab-box { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 7px; padding: 9px 11px; font-size: 12px; color: #9a3412; line-height: 1.65; }
  .tender-tag { margin-top: 5px; font-size: 11px; color: #92400e; background: #fef3c7; border: 1px solid #fde68a; padding: 3px 8px; border-radius: 5px; display: inline-block; }

  /* Edu ratio text */
  .edu-ratio-text { font-size: 11px; color: #6b7280; background: #f9fafb; border: 1px solid #e5e8f0; padding: 5px 8px; border-radius: 5px; line-height: 1.5; margin-top: 4px; }

  /* ── 컨텍/제안 상태 트래킹 ── */
  .status-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; padding: 8px 10px; background: #f8faff; border: 1px solid #dbeafe; border-radius: 8px; }
  .status-bar-label { font-size: 10px; color: #64748b; font-weight: 700; letter-spacing: 0.5px; margin-right: 2px; }
  .status-btn { padding: 4px 10px; border-radius: 16px; border: 1.5px solid #e5e8f0; font-size: 11px; font-weight: 600; cursor: pointer; background: #fff; color: #64748b; transition: all 0.12s; white-space: nowrap; }
  .status-btn:hover { border-color: #94a3b8; }
  .status-btn.s-contacted  { background: #dbeafe; border-color: #3b82f6; color: #1d4ed8; }
  .status-btn.s-proposed   { background: #f0fdf4; border-color: #22c55e; color: #15803d; }
  .status-btn.s-ongoing    { background: #fef9c3; border-color: #eab308; color: #854d0e; }
  .status-btn.s-done       { background: #dcfce7; border-color: #16a34a; color: #14532d; }
  .status-btn.s-pass       { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
  .status-clear-btn { margin-left: auto; font-size: 10px; color: #9ca3af; cursor: pointer; background: none; border: none; padding: 2px 4px; }
  .status-clear-btn:hover { color: #ef4444; }
  .status-memo-row { display: flex; gap: 6px; margin-top: 6px; }
  .status-memo-input { flex: 1; padding: 5px 9px; border: 1px solid #e5e8f0; border-radius: 6px; font-size: 12px; outline: none; }
  .status-memo-input:focus { border-color: #3b82f6; }
  .status-memo-save { padding: 5px 10px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .status-current { font-size: 11px; color: #6b7280; margin-top: 4px; }

  /* 목록 아이콘 */
  .track-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .td-contacted { background: #3b82f6; }
  .td-proposed  { background: #22c55e; }
  .td-ongoing   { background: #eab308; }
  .td-done      { background: #16a34a; }
  .td-pass      { background: #ef4444; }
  .track-export-btn { font-size: 10px; padding: 3px 8px; border: 1px solid #e5e8f0; border-radius: 5px; background: #fff; color: #6b7280; cursor: pointer; margin-left: auto; }
  .track-export-btn:hover { background: #f0f4ff; color: #3b82f6; }
</style>
</head>

<div class="header">

  </div>
</div>

<div class="layout">

    <div class="panel-head">

      <button class="f-btn" onclick="setFilter('tracked',this)">📌 추적 중</button>
      <button class="track-export-btn" onclick="exportTracking()" title="추적 현황 CSV 내보내기">📊 내보내기</button>
    </div>
    <div class="company-list" id="companyList"></div>
  </div>

  <!-- Right: Proposal generator -->
  <div class="panel">
    <div class="panel-head">
      <span>✉️</span>
      <h2>맞춤 제안 생성</h2>
    </div>
    <div class="proposal-area" id="proposalArea">
      <div class="empty-state">
        <div class="empty-icon">👈</div>
        <div class="empty-text">왼쪽에서 기업을 선택하면<br>맞춤 전략·전화 스크립트·이메일을<br>자동으로 생성합니다.</div>
      </div>
    </div>
  </div>
</div>

// 전체 214개 기업 (CCK 96개 + CSR 아카이빙 131개 → 병합 후 고유 214개)
// State
// ═══════════════════════════════════════════════════════
let selectedCompany = null;
let currentFilter = 'all';
let results = { strategy: '', phone: '', email: '' };
let activeTab = 'strategy';
let isLoading = false;

// ─── 컨텍/제안 상태 트래킹 ───
const STATUS_LABELS = {
  contacted: '📞 컨텍함',
  proposed:  '✉️ 제안 발송',
  ongoing:   '🔄 협의 중',
  done:      '✅ 완료',
  pass:      '⛔ 패스',
};

function getAllTracking() {
  try { return JSON.parse(localStorage.getItem('proposal_tracking') || '{}'); }
  catch(e) { return {}; }
}
function getTracking(name) {
  return getAllTracking()[name] || null;
}
function setTracking(name, status, memo) {
  const all = getAllTracking();
  const today = new Date().toLocaleDateString('ko-KR', {year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\.\s*/g,'-').replace(/-$/,'');
  if (!all[name]) all[name] = {};
  all[name].status = status;
  all[name].date = today;
  if (memo !== undefined) all[name].memo = memo;
  localStorage.setItem('proposal_tracking', JSON.stringify(all));
}
function clearTracking(name) {
  const all = getAllTracking();
  delete all[name];
  localStorage.setItem('proposal_tracking', JSON.stringify(all));
}
function saveMemo(name) {
  const inp = document.getElementById('trackMemoInput');
  if (!inp) return;
  const all = getAllTracking();
  if (!all[name]) all[name] = { status: 'contacted', date: '' };
  all[name].memo = inp.value.trim();
  localStorage.setItem('proposal_tracking', JSON.stringify(all));
  renderArea();
}
function exportTracking() {
  const all = getAllTracking();
  const rows = [['기업명','상태','날짜','메모']];
  for (const [name, d] of Object.entries(all)) {
    rows.push([name, STATUS_LABELS[d.status] || d.status, d.date || '', d.memo || '']);
  }
  const bom = '\uFEFF';
  const csv = bom + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = '제안_추적현황_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

// ═══════════════════════════════════════════════════════
// List
// ═══════════════════════════════════════════════════════
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const list = document.getElementById('companyList');

  let filtered = COMPANY_DATA.filter(c => {
    const sec = (c.sector || '').toLowerCase();
    if (q && !c.name.toLowerCase().includes(q) && !sec.includes(q)) return false;
    if (currentFilter === 'A') return c.priority === 'A';
    if (currentFilter === 'B') return c.priority === 'B';
    if (currentFilter === 'C') return c.priority === 'C';
    if (currentFilter === 'D') return c.priority === 'D';
    if (currentFilter === 'rec') return c.recommendation === 'Y-우선' || c.recommendation === 'Y-조건부';
    if (currentFilter === 'nograde') return !c.priority && !c.recommendation;
    if (currentFilter === 'tracked') return !!getTracking(c.name);
    return true;
  });

  document.getElementById('listCount').textContent = filtered.length + '개';

  list.innerHTML = filtered.map(c => {
    const dotClass = c.priority ? `p-${c.priority}` : 'p-none';
    const sectorText = c.sector ? c.sector.split(/[·,/]/)[0].trim() : '—';
    const safeName = c.name.replace(/'/g, "\'");
    const isSelected = selectedCompany?.name === c.name;
    const recMark = c.recommendation === 'Y-우선' ? ' ✅' : c.recommendation === 'Y-조건부' ? ' 🔶' : '';
    const track = getTracking(c.name);
    const trackDot = track ? `<div class="track-dot td-${track.status}" title="${STATUS_LABELS[track.status] || ''} ${track.date || ''}"></div>` : '';
    return `<div class="company-row ${isSelected ? 'selected' : ''}" onclick="selectCompany('${safeName}')">
      <div class="priority-dot ${dotClass}"></div>
      ${trackDot}
      <span class="company-name-text">${c.name}${recMark}</span>
      <span class="sector-badge">${sectorText}</span>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════
// Select company
// ═══════════════════════════════════════════════════════
async function selectCompany(name) {
  selectedCompany = COMPANY_DATA.find(c => c.name === name);
  results = { strategy: '', phone: '', email: '' };
  activeTab = 'strategy';
  renderList();
  renderArea();

  // Fetch recent news in background
  const news = await fetchRecentNews(name);
  selectedCompany._news = news;
  renderArea();
}

async function fetchRecentNews(companyName) {
  try {
    const res = await fetch('./index.html');
    const html = await res.text();
    const m = html.match(/\/\/ FINDINGS_START[\s\S]*?const FINDINGS = (\[[\s\S]*?\]);[\s\S]*?\/\/ FINDINGS_END/);
    if (m) {
      const findings = JSON.parse(m[1]);
      return findings.filter(f => f.company === companyName || f.company.includes(companyName.split(' ')[0])).slice(0, 3);
    }
  } catch(e) {}
  return [];
}

      </div>
      <div class="api-row">
        <span class="api-label">모델</span>
        <select class="api-select" id="modelSelect">
          <option value="claude-sonnet-4-5" ${savedModel === 'claude-sonnet-4-5' ? 'selected' : ''}>claude-sonnet-4-5 (추천)</option>
          <option value="claude-opus-4-5" ${savedModel === 'claude-opus-4-5' ? 'selected' : ''}>claude-opus-4-5</option>
          <option value="claude-haiku-4-5-20251001" ${savedModel === 'claude-haiku-4-5-20251001' ? 'selected' : ''}>claude-haiku-4-5 (빠름)</option>
        </select>
      </div>
      <div id="apiAlert"></div>
    </div>

    <!-- Generate button -->
    <button class="generate-btn" id="generateBtn" onclick="generate()" ${isLoading ? 'disabled' : ''}>
      ${isLoading ? '⏳ 생성 중...' : '✨ 맞춤 전략 + 전화 스크립트 + 이메일 생성'}
    </button>

    <!-- Results -->
    ${results.strategy ? `
    <div class="result-section">
      <div class="result-tabs">
        <div class="result-tab ${activeTab === 'strategy' ? 'active' : ''}" onclick="switchTab('strategy')">📋 제안 전략</div>
        <div class="result-tab ${activeTab === 'phone' ? 'active' : ''}" onclick="switchTab('phone')">📞 전화 스크립트</div>
        <div class="result-tab ${activeTab === 'email' ? 'active' : ''}" onclick="switchTab('email')">📧 이메일 초안</div>
      </div>
      <div class="result-content">
        <div class="result-text">${escapeHtml(results[activeTab] || '—')}</div>
        <div class="copy-row">
          <button class="copy-btn" onclick="copyResult('${activeTab}')">📋 복사</button>
          <button class="copy-btn" onclick="downloadTxt()">📄 TXT 저장</button>
          <button class="copy-btn" onclick="downloadCsv()" style="color:#166534;background:#dcfce7;border-color:#86efac;">📊 CSV 저장 (구글시트)</button>
        </div>
      </div>
    </div>` : ''}
  `;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══════════════════════════════════════════════════════
// API & generation
// ═══════════════════════════════════════════════════════
function saveApiSettings() {
  const key = document.getElementById('apiKeyInput')?.value.trim();
  const model = document.getElementById('modelSelect')?.value;
  if (key) localStorage.setItem('anthropic_api_key', key);
  if (model) localStorage.setItem('anthropic_model', model);
  const el = document.getElementById('apiAlert');
  if (el) {
    el.innerHTML = '<div class="alert alert-success">✓ 저장되었습니다.</div>';
    setTimeout(() => { if(el) el.innerHTML = ''; }, 2500);
  }
}

function switchTab(tab) {
  activeTab = tab;
  renderArea();
  // scroll result into view
  setTimeout(() => document.querySelector('.result-section')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
}

async function copyResult(tab) {
  const text = results[tab];
  if (!text) return;
  await navigator.clipboard.writeText(text);
  const btn = document.querySelector('.copy-btn');
  if (btn) { btn.textContent = '✓ 복사됨'; setTimeout(() => { btn.textContent = '📋 복사'; }, 2000); }
}

async function generate() {
  const apiKey = document.getElementById('apiKeyInput')?.value.trim() || localStorage.getItem('anthropic_api_key') || '';
  if (!apiKey) {
    const el = document.getElementById('apiAlert');
    if (el) el.innerHTML = '<div class="alert alert-error">API Key를 입력하고 저장해주세요.</div>';
    return;
  }

  const model = document.getElementById('modelSelect')?.value || localStorage.getItem('anthropic_model') || 'claude-sonnet-4-5';
  const c = selectedCompany;

  console.log('[DEBUG] generate() 시작 - model:', model, '| apiKey 앞4자:', apiKey.slice(0,7));

  // Save key for next time
  localStorage.setItem('anthropic_api_key', apiKey);
  localStorage.setItem('anthropic_model', model);

  isLoading = true;
  renderArea();

  try {
    const news = c._news || [];
    const prompt = buildPrompt(c, news);
    console.log('[DEBUG] callClaude 호출 중...');
    const raw = await callClaude(apiKey, model, prompt);
    console.log('[DEBUG] raw 응답 길이:', raw.length, '| 앞 200자:', raw.slice(0, 200));

    // Parse sections
    const strategyM = raw.match(/\[맞춤 제안 전략\]([\s\S]*?)(?=\[전화 스크립트\]|$)/);
    const phoneM = raw.match(/\[전화 스크립트\]([\s\S]*?)(?=\[이메일 초안\]|$)/);
    const emailM = raw.match(/\[이메일 초안\]([\s\S]*?)$/);

    results.strategy = strategyM ? strategyM[1].trim() : raw;
    results.phone = phoneM ? phoneM[1].trim() : '(섹션을 찾을 수 없습니다. 전략 탭 전체 내용을 참고하세요.)';
    results.email = emailM ? emailM[1].trim() : '(섹션을 찾을 수 없습니다. 전략 탭 전체 내용을 참고하세요.)';
    activeTab = 'strategy';
    console.log('[DEBUG] results.strategy 길이:', results.strategy.length);

  } catch (err) {
    results.strategy = `⚠️ 오류가 발생했습니다.\n\n오류 내용: ${err.message}\n\n확인사항:\n1. API Key가 올바르게 입력·저장됐는지 확인\n2. Anthropic Console에서 크레딧($)이 있는지 확인\n3. 페이지를 새로고침하고 다시 시도`;
    results.phone = '—';
    results.email = '—';
    activeTab = 'strategy';
    console.error('[DEBUG] Claude API 오류:', err);
  }

  console.log('[DEBUG] isLoading=false, renderArea() 호출. results.strategy 길이:', results.strategy.length);
  isLoading = false;
  renderArea();
  setTimeout(() => document.querySelector('.result-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

function buildPrompt(c, news) {
  return `당신은 KMA 한국능률협회 평생교육본부 임팩트 비즈니스팀의 전략 어시스턴트입니다.

## KMA 소개
- 한국능률협회(KMA): 설립 62년, 국내 최대 기업교육 전문기관
- 핵심 역량: 교육과정 개발·운영, 전문 강사 공급, 성과관리 시스템, 전국 지역 네트워크(지역기관 연계), 취약계층 교육사업 경험
- 임팩트 비즈니스팀: 기업·재단의 사회공헌 교육사업 위탁운영·파트너십·공동기획 담당
- 발신자: KMA 평생교육본부 이하늘 연구원

## 제안 대상 기업 정보
- 기업명: ${c.name}
- 섹터: ${c.sector}
- 핵심가치: ${c.coreValues}
- 연평균 기부금(사랑의열매 기준): ${c.avgDonation ? (c.avgDonation / 100).toFixed(1) + '억원' : '미확인'}
- 교육사업 규모: ${c.eduCount ? c.eduCount + '개' + (c.eduRatioPct ? ' (전체 사업의 ' + c.eduRatioPct + '%)' : '') : (c.eduRatioText || '미확인')}
- 외부 협력·위탁 정도: ${c.externalCollab || '미확인'}
- 주요 프로그램: ${(c.mainPrograms || []).join(', ')}
- KMA 진입 포인트: ${(c.kmaPoints || []).join(' / ')}

${news.length > 0 ? `## 최근 동향 (모니터링 수집)
${news.map(n => `- [${n.date}] ${n.title} (${n.type === 'recruit' ? '모집 공고 — ' + n.trackWhen : '뉴스'})`).join('\n')}
` : ''}
---

위 정보를 바탕으로 아래 세 가지를 작성해주세요.
반드시 각 항목을 정확히 아래 헤더로 시작해주세요 (대괄호 포함).

[맞춤 제안 전략]
이 기업에 KMA가 왜 필요한지, 어떤 각도와 타이밍으로 접근할지, 핵심 메시지와 차별화 포인트를 서술하세요.
구체적인 프로그램명과 KMA의 역할을 명시하고 300자 내외로 작성하세요.

[전화 스크립트]

구성: ① 인사 및 소속·이름 소개 ② 담당 부서·담당자 연결 요청 ③ 전화 목적 설명 (30초 핵심 멘트) ④ 예상 반응 3가지 대응 (관심 있을 때 / 바쁠 때 / 기존 파트너가 있을 때)

[이메일 초안]

300자 내외로 간결하게, 과도한 자화자찬 없이 상대방 관점에서 협업 가치를 설명하세요.`;
}

async function callClaude(apiKey, model, prompt) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model,
      max_tokens: 3000,
      messages: [{ role: 'user', content: prompt }]
    })
  });

  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { const j = await res.json(); msg = j.error?.message || msg; } catch(e) {}
    throw new Error(msg);
  }

  const data = await res.json();
  return data.content[0].text;
}

// ═══════════════════════════════════════════════════════
// Download
// ═══════════════════════════════════════════════════════
function triggerDownload(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadTxt() {
  const c = selectedCompany;
  if (!c || !results.strategy) return;
  const date = new Date().toLocaleDateString('ko-KR');
  const line = '='.repeat(52);
  const content = [
    `KMA 맞춤 제안 · ${c.name}`,
    `생성일: ${date}  |  섹터: ${c.sector}  |  제안등급: ${c.priority}등급`,
    line,
    '',
    '【맞춤 제안 전략】',
    results.strategy,
    '',
    line,
    '',
    '【전화 스크립트】',
    results.phone,
    '',
    line,
    '',
    '【이메일 초안】',
    results.email,
  ].join('\n');
  const stamp = new Date().toISOString().slice(0, 10);
  triggerDownload(content, `KMA_제안_${c.name}_${stamp}.txt`, 'text/plain;charset=utf-8');
}

function downloadCsv() {
  const c = selectedCompany;
  if (!c || !results.strategy) return;
  const esc = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const date = new Date().toLocaleDateString('ko-KR');
  const headers = ['기업명','섹터','제안등급','우선순위','연평균기부금(억원)','교육사업수','교육비중(%)','외부위탁도','생성일','맞춤제안전략','전화스크립트','이메일초안'];
  const values = [
    c.name, c.sector, c.priority + '등급',
    c.monPriority === 'high' ? '우선순위' : '조건부',
    c.avgDonation ? (c.avgDonation / 100).toFixed(1) : '',
    c.eduCount ?? '', c.eduRatio ?? '',
    c.externalCollab, date,
    results.strategy, results.phone, results.email
  ];
  // UTF-8 BOM(﻿) 추가 — 구글시트·엑셀에서 한글 깨짐 방지
  const csv = '﻿' + headers.map(esc).join(',') + '\n' + values.map(esc).join(',');
  const stamp = new Date().toISOString().slice(0, 10);
  triggerDownload(csv, `KMA_제안_${c.name}_${stamp}.csv`, 'text/csv;charset=utf-8');
}
